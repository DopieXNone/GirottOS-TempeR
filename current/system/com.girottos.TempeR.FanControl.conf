<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- only temper-fand (root) owns the name -->
  <policy user="root">
    <allow own="com.girottos.TempeR.FanControl"/>
  </policy>
  <!-- anybody may ask; every change is checked with polkit -->
  <policy context="default">
    <allow send_destination="com.girottos.TempeR.FanControl"/>
  </policy>
</busconfig>
